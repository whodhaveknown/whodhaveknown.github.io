<!DOCTYPE html>
<html lang="ko">
<head>

<title>Blog</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

        <section class="viewer">

                    <div class="viewer-title">
                        ORIGINAL SCAN
                    </div>

                    <button class="report">

            </div>

        <!-- RIGHT : TEXT -->

        <section class="article">

            <div class="article-top">

                <div>

                    <div class="article-sub">
                        CINEMA & FILM ・ INVERNO 1966-1967
                    </div>

                    <h2>
                        Title
                    </h2>

                    <div class="author">
                        Subtitle
                    </div>

                </div>

                <div class="page">
                    PAGE 17
                </div>

            </div>

            <div class="article-body">

                <p>
                    내용
                </p>

            </div>

        </section>

    </div>

    <div class="bottom-nav">
        <a href="#">← Page 왼쪽</a>
        <a href="#">Page 오른쪽 →</a>
    </div>

</div>
