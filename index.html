<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" fcontent="width=device-width, initial-scale=1.0" />

<title>Blog</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

</head>

<body>

<header>

    <div class="nav">

        <div class="logo">
            <h1>My Blog</h1>
            <span>MOMENTS</span>
        </div>

        <div class="search">
            <input type="text" placeholder="KEYWORD" />
            <button>⌕</button>
        </div>

        <nav class="menu">
            <a href="#">Home</a>
            <a href="#">Pics</a>
            <a href="#">Notes</a>
        </nav>

    </div>

</header>

<div class="container">

    <div class="desc">
        문구
    </div>

    <div class="content">

        <!-- LEFT : IMAGE -->

        <section class="viewer">

            <div class="viewer-top">

                <div class="viewer-left">

                    <div class="viewer-title">
                        VIEWER
                    </div>

                    <button class="viewer-info">
                       INFO
                    </button>

                </div>

                <div class="viewer-icons">
                    <span>－</span>
                    <span>RESET</span>
                    <span>＋</span>
                    <span>↻</span>
                    <span>↗</span>
                </div>

            </div>

            <div class="scan">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiflkuYAmplWZsIR53qL3C0IzOWvYchM5tL3uKFaCDlhr08YLsxrd9yd2ysWVhHY9gYVPM16OivWmDKnqtlUySXZOeSh-2zvQofxkGUSs3ryVaw2y35jns2yBW98sxi6qio4JxF1K_v2O2u3eKrv0ZqAv1glZv7dB_zMAC1QxKNRAGdO9oodZyGNSIuhnw/w1684-h1069-p-k-no-nu/1.jpg">
            </div>

        </section>

        <!-- RIGHT : TEXT -->

        <section class="article">

            <div class="article-top">

                <div>

                    <div class="article-category">
                        카테고리 / 날짜
                    </div>

<div class="article-sub">
                       제목
                    </div>

                    <div class="article-name">
                       닉네임
                    </div>

                </div>

            </div>

            <div class="article-body">

                <p>
                    내용
                </p>

            </div>

        </section>

    </div>

    <div class="bottom-nav">
        <a href="#">← Page</a>
        <a href="#">Page →</a>
    </div>

</div>

</body>
</html>
